<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CRM Macchine</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--sur:#181818;--sur2:#222;--bor:#2a2a2a;--acc:#d4a843;--acc2:#e8c870;--txt:#f0ede6;--txt2:#888;--txt3:#555;--red:#e05555;--green:#5cb85c;--blue:#5b9bd5;--rad:10px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;min-height:100vh;font-size:15px}
/* LOGIN */
.login-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:24px}
.login-box{width:100%;max-width:300px}
.login-logo{font-family:'DM Mono',monospace;font-size:15px;color:var(--acc);letter-spacing:.1em;text-align:center;margin-bottom:4px}
.login-sub{font-size:11px;color:var(--txt3);text-align:center;margin-bottom:28px}
.login-input{width:100%;background:var(--sur2);border:1px solid var(--bor);border-radius:8px;padding:14px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;text-align:center;letter-spacing:.15em;margin-bottom:10px}
.login-input:focus{border-color:var(--acc)}
.login-btn{width:100%;background:var(--acc);color:#000;border:none;border-radius:9px;padding:13px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer}
.login-err{font-size:12px;color:var(--red);text-align:center;margin-top:8px;min-height:16px}
/* LOADING */
.loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:998}
.loading-logo{font-family:'DM Mono',monospace;font-size:15px;color:var(--acc);margin-bottom:16px;letter-spacing:.1em}
.loading-spinner{width:30px;height:30px;border:2px solid var(--bor);border-top-color:var(--acc);border-radius:50%;animation:spin 1s linear infinite}
.loading-text{font-size:12px;color:var(--txt3);margin-top:10px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* HEADER */
.header{background:var(--sur);border-bottom:1px solid var(--bor);padding:14px 16px 10px;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.logo{font-family:'DM Mono',monospace;font-size:13px;color:var(--acc);letter-spacing:.08em}
.logo-sub{font-size:11px;color:var(--txt3);margin-top:1px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--txt3);display:inline-block;margin-right:5px;transition:background .3s}
.sync-dot.ok{background:var(--green)}.sync-dot.err{background:var(--red)}.sync-dot.loading{background:var(--acc);animation:pulse 1s infinite}
.sync-label{font-size:11px;color:var(--txt3)}
.tabs{display:flex;gap:6px}
.tab{flex:1;padding:8px;border-radius:7px;border:1px solid var(--bor);background:transparent;color:var(--txt2);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;transition:all .15s;text-align:center}
.tab.active{background:var(--acc);color:#000;border-color:var(--acc);font-weight:600}
/* CONTENT */
.content{padding:14px 14px 90px;max-width:600px;margin:0 auto}
/* SEARCH */
.search-bar{display:flex;gap:8px;margin-bottom:14px}
.search-bar input{flex:1;background:var(--sur);border:1px solid var(--bor);border-radius:var(--rad);padding:10px 13px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;outline:none}
.search-bar input:focus{border-color:var(--acc)}
.search-bar input::placeholder{color:var(--txt3)}
.btn-add{background:var(--acc);color:#000;border:none;border-radius:var(--rad);padding:10px 16px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:500}
.btn-ghost{background:var(--sur2);color:var(--txt2)}
.btn-danger{background:transparent;color:var(--red);border:1px solid var(--red)}
/* CHIPS */
.chips{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:5px 12px;border-radius:20px;border:1px solid var(--bor);background:transparent;color:var(--txt2);font-size:12px;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif}
.chip.active{border-color:var(--acc);color:var(--acc);background:rgba(212,168,67,.08)}
/* STATS */
.stats-bar{display:flex;gap:8px;margin-bottom:14px}
.stat-pill{flex:1;background:var(--sur);border:1px solid var(--bor);border-radius:8px;padding:8px 10px;text-align:center}
.stat-num{font-family:'DM Mono',monospace;font-size:18px;font-weight:500;color:var(--acc)}
.stat-lbl{font-size:10px;color:var(--txt3);margin-top:1px}
/* CARDS */
.card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rad);padding:13px 14px;margin-bottom:9px;cursor:pointer;transition:border-color .15s}
.card:active{border-color:var(--acc)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.card-name{font-weight:600;font-size:15px;line-height:1.3}
.card-company{font-size:12px;color:var(--txt2);margin-top:2px}
.badge{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500;white-space:nowrap}
.badge-cliente{background:rgba(91,155,213,.15);color:var(--blue)}
.badge-fornitore{background:rgba(212,168,67,.12);color:var(--acc)}
.badge-broker{background:rgba(92,184,92,.12);color:var(--green)}
.badge-misto{background:rgba(224,85,85,.12);color:var(--red)}
.card-meta{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.card-meta-item{font-size:11px;color:var(--txt3)}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{background:var(--sur2);color:var(--txt3);padding:2px 8px;border-radius:4px;font-size:11px;font-family:'DM Mono',monospace}
/* REMINDER BADGE */
.remind-badge{background:rgba(224,85,85,.15);color:var(--red);border:1px solid rgba(224,85,85,.3);padding:2px 8px;border-radius:20px;font-size:11px;font-weight:500}
/* LOG PREVIEW */
.last-log{font-size:12px;color:var(--txt2);margin-top:7px;padding-top:7px;border-top:1px solid var(--bor);line-height:1.4}
.last-log-date{font-size:10px;color:var(--txt3);font-family:'DM Mono',monospace}
/* SEG CARDS */
.seg-card{background:var(--sur);border:1px solid var(--bor);border-radius:var(--rad);padding:13px 14px 13px 18px;margin-bottom:9px;cursor:pointer;position:relative}
.seg-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px 0 0 3px}
.seg-macchina{font-weight:600;font-size:15px}
.seg-tipo-offerta{background:rgba(224,85,85,.12);color:var(--red)}
.seg-tipo-richiesta{background:rgba(91,155,213,.12);color:var(--blue)}
.seg-dettagli{font-family:'DM Mono',monospace;font-size:12px;color:var(--acc2);margin-top:5px}
.seg-note{font-size:12px;color:var(--txt2);margin-top:7px;border-top:1px solid var(--bor);padding-top:7px;line-height:1.4}
/* EVENTS FEED */
.events-feed{padding:0}
.event-item{display:flex;gap:12px;margin-bottom:16px}
.event-line{display:flex;flex-direction:column;align-items:center}
.event-dot{width:8px;height:8px;border-radius:50%;background:var(--acc);flex-shrink:0;margin-top:4px}
.event-tail{flex:1;width:1px;background:var(--bor);margin-top:4px}
.event-body{flex:1}
.event-contact{font-size:11px;color:var(--acc);font-weight:600;margin-bottom:2px}
.event-text{font-size:14px;color:var(--txt);line-height:1.5}
.event-date{font-size:10px;color:var(--txt3);font-family:'DM Mono',monospace;margin-top:3px}
/* REMINDER SECTION */
.remind-section{background:rgba(224,85,85,.06);border:1px solid rgba(224,85,85,.2);border-radius:var(--rad);padding:12px 14px;margin-bottom:14px}
.remind-title{font-size:12px;color:var(--red);font-weight:600;margin-bottom:10px;text-transform:uppercase;letter-spacing:.04em}
.remind-item{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid rgba(224,85,85,.1)}
.remind-item:last-child{border-bottom:none}
.remind-name{font-size:13px;font-weight:500}
.remind-days{font-size:11px;color:var(--red);font-family:'DM Mono',monospace}
/* EMPTY */
.empty{text-align:center;padding:50px 20px;color:var(--txt3)}
.empty-icon{font-size:36px;margin-bottom:10px}
/* MODALS */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:200;display:flex;align-items:flex-end;justify-content:center}
.modal-overlay.hidden{display:none}
.modal{background:var(--sur);border-radius:16px 16px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;padding:20px 16px 40px}
.modal-handle{width:36px;height:4px;background:var(--bor);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:17px;font-weight:600;margin-bottom:18px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;color:var(--txt2);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.04em}
.form-input{width:100%;background:var(--sur2);border:1px solid var(--bor);border-radius:8px;padding:10px 12px;color:var(--txt);font-family:'DM Sans',sans-serif;font-size:14px;outline:none}
.form-input:focus{border-color:var(--acc)}
.form-input::placeholder{color:var(--txt3)}
textarea.form-input{resize:vertical;min-height:80px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-actions{display:flex;gap:8px;margin-top:18px}
.btn-primary{flex:1;background:var(--acc);color:#000;border:none;border-radius:9px;padding:13px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer}
.btn-secondary{background:var(--sur2);color:var(--txt2);border:none;border-radius:9px;padding:13px 18px;font-family:'DM Sans',sans-serif;font-size:15px;cursor:pointer}
/* DETAIL */
.detail-label{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.detail-value{font-size:14px;color:var(--txt);margin-bottom:14px;line-height:1.5}
.detail-actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
/* LOG IN DETAIL */
.log-add-btn{width:100%;background:var(--sur2);border:1px dashed var(--bor);border-radius:8px;padding:11px;color:var(--acc);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;margin-top:4px;margin-bottom:16px;text-align:center}
.log-add-btn:active{border-color:var(--acc)}
.section-title{font-size:11px;color:var(--txt3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid var(--bor)}
/* MATCH */
.match-box{background:rgba(212,168,67,.06);border:1px solid rgba(212,168,67,.25);border-radius:var(--rad);padding:12px 14px;margin-bottom:14px}
.match-title{font-size:11px;color:var(--acc);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.match-item{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(212,168,67,.1);cursor:pointer}
.match-item:last-child{border-bottom:none}
.match-name{font-size:13px;font-weight:500;color:var(--txt)}
.match-sub{font-size:11px;color:var(--txt3);margin-top:1px}
.match-kw{font-size:10px;color:var(--acc2);font-family:'DM Mono',monospace}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="login-screen">
  <div class="login-box">
    <div class="login-logo">◈ CRM MACCHINE</div>
    <div class="login-sub">MICY S.R.O.</div>
    <input class="login-input" type="password" id="login-pw" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Entra</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>

<!-- LOADING -->
<div class="loading-screen" id="loading" style="display:none">
  <div class="loading-logo">◈ CRM MACCHINE</div>
  <div class="loading-spinner"></div>
  <div class="loading-text">Caricamento...</div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <div class="header">
    <div class="header-top">
      <div>
        <div class="logo">◈ CRM MACCHINE</div>
        <div class="logo-sub">MICY S.R.O.</div>
      </div>
      <div style="display:flex;align-items:center">
        <span class="sync-dot" id="sync-dot"></span>
        <span class="sync-label" id="sync-label">...</span>
      </div>
    </div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('contatti')">👤 Rubrica</button>
      <button class="tab" onclick="switchTab('macchine')">🚜 Macchine</button>
      <button class="tab" onclick="switchTab('eventi')">📋 Events</button>
    </div>
  </div>

  <div class="content">

    <!-- TAB CONTATTI -->
    <div id="view-contatti">
      <div id="remind-box"></div>
      <div id="stats-contatti" class="stats-bar"></div>
      <div class="search-bar">
        <input type="text" id="search-contatti" placeholder="Cerca nome, azienda, paese..." oninput="renderContatti()">
        <button class="btn-add" onclick="openModalContatto()">+ Nuovo</button>
      </div>
      <div class="chips">
        <button class="chip active" onclick="setFilterC('tutti',this)">Tutti</button>
        <button class="chip" onclick="setFilterC('cliente',this)">Clienti</button>
        <button class="chip" onclick="setFilterC('fornitore',this)">Fornitori</button>
        <button class="chip" onclick="setFilterC('broker',this)">Broker</button>
        <button class="chip" onclick="setFilterC('misto',this)">Misto</button>
      </div>
      <div id="list-contatti"></div>
    </div>

    <!-- TAB MACCHINE -->
    <div id="view-macchine" style="display:none">
      <div id="stats-macchine" class="stats-bar"></div>
      <div class="search-bar">
        <input type="text" id="search-macchine" placeholder="Cerca macchina, marca..." oninput="renderMacchine()">
        <button class="btn-add" onclick="openModalMacchina()">+ Nuova</button>
      </div>
      <div class="chips">
        <button class="chip active" onclick="setFilterM('tutti',this)">Tutte</button>
        <button class="chip" onclick="setFilterM('aperta',this)">Aperte</button>
        <button class="chip" onclick="setFilterM('offerta',this)">Offerte</button>
        <button class="chip" onclick="setFilterM('richiesta',this)">Richieste</button>
        <button class="chip" onclick="setFilterM('chiusa',this)">Chiuse</button>
      </div>
      <div id="list-macchine"></div>
    </div>

    <!-- TAB EVENTI -->
    <div id="view-eventi" style="display:none">
      <div class="search-bar">
        <input type="text" id="search-eventi" placeholder="Cerca nei log..." oninput="renderEventi()">
      </div>
      <div id="list-eventi"></div>
    </div>

  </div>
</div>

<!-- MODAL NUOVO CONTATTO -->
<div class="modal-overlay hidden" id="modal-contatto">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="mc-title">Nuovo Contatto</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Nome *</label><input class="form-input" id="c-nome" placeholder="Marco"></div>
      <div class="form-group"><label class="form-label">Cognome</label><input class="form-input" id="c-cognome" placeholder="Rossi"></div>
    </div>
    <div class="form-group"><label class="form-label">Azienda</label><input class="form-input" id="c-azienda" placeholder="Rossi Srl"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Tipo *</label>
        <select class="form-input" id="c-tipo">
          <option value="cliente">Cliente</option>
          <option value="fornitore">Fornitore</option>
          <option value="broker">Broker</option>
          <option value="misto">Misto</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Paese</label><input class="form-input" id="c-paese" placeholder="Italia"></div>
    </div>
    <div class="form-group"><label class="form-label">Cerca sempre</label><input class="form-input" id="c-cerca" placeholder="es. escavatori Cat, dumper..."></div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeModal('modal-contatto')">Annulla</button>
      <button class="btn-primary" onclick="salvaContatto()">Salva</button>
    </div>
  </div>
</div>

<!-- MODAL NUOVA MACCHINA -->
<div class="modal-overlay hidden" id="modal-macchina">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="mm-title">Macchina sentita in giro</div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Tipo *</label>
        <select class="form-input" id="m-tipo">
          <option value="offerta">Offerta (vendono)</option>
          <option value="richiesta">Richiesta (cercano)</option>
        </select>
      </div>
      <div class="form-group"><label class="form-label">Stato</label>
        <select class="form-input" id="m-status">
          <option value="aperta">Aperta</option>
          <option value="chiusa">Chiusa</option>
        </select>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Macchina *</label><input class="form-input" id="m-macchina" placeholder="es. Caterpillar 336 Escavatore"></div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Anno</label><input class="form-input" id="m-anno" type="number" placeholder="2018"></div>
      <div class="form-group"><label class="form-label">Ore</label><input class="form-input" id="m-ore" type="number" placeholder="8500"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">Prezzo €</label><input class="form-input" id="m-prezzo" type="number" placeholder="95000"></div>
      <div class="form-group"><label class="form-label">Paese</label><input class="form-input" id="m-paese" placeholder="Germania"></div>
    </div>
    <div class="form-group"><label class="form-label">Fonte (contatto)</label><input class="form-input" id="m-contatto" placeholder="Nome contatto..." list="dl-contatti"><datalist id="dl-contatti"></datalist></div>
    <div class="form-group"><label class="form-label">Note</label><textarea class="form-input" id="m-note" placeholder="Condizioni, dettagli, attrezzature..."></textarea></div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeModal('modal-macchina')">Annulla</button>
      <button class="btn-primary" onclick="salvaMacchina()">Salva</button>
    </div>
  </div>
</div>

<!-- MODAL AGGIUNGI LOG -->
<div class="modal-overlay hidden" id="modal-log">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Aggiungi aggiornamento</div>
    <div class="form-group" id="log-contact-info" style="font-size:13px;color:var(--acc);margin-bottom:12px"></div>
    <div class="form-group"><textarea class="form-input" id="log-testo" placeholder="Cosa è successo? Cosa ti ha detto? Cosa ha comprato o venduto?" style="min-height:120px"></textarea></div>
    <div class="form-actions">
      <button class="btn-secondary" onclick="closeModal('modal-log')">Annulla</button>
      <button class="btn-primary" onclick="salvaLog()">Salva</button>
    </div>
  </div>
</div>

<!-- MODAL DETTAGLIO CONTATTO -->
<div class="modal-overlay hidden" id="modal-detail-c">
  <div class="modal" id="detail-c-content"></div>
</div>

<!-- MODAL DETTAGLIO MACCHINA -->
<div class="modal-overlay hidden" id="modal-detail-m">
  <div class="modal" id="detail-m-content"></div>
</div>

<script>
const BIN_ID='6a02ee0d250b1311c33a87c7';
const MASTER_KEY='$2a$10$Fp1SmnPMs5I59rGoK8kzW.GvacWccf.CZ8dC9sHc8Yl6ytz/4Jfji';
const ACCESS_KEY='$2a$10$dAhYT3aMGNtOmj4i8K6ay.BIhIC4QudlZ7C8QbD1eHzGe0KsF1PEG';
const API='https://api.jsonbin.io/v3/b/'+BIN_ID;
const PWD='micy2024';
const REMIND_DAYS=60;

let contatti=[],macchine=[],eventi=[],filterC='tutti',filterM='tutti',editCId=null,editMId=null,logContactId=null,currentTab='contatti',saving=false;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return'';const dt=new Date(d);return dt.toLocaleDateString('it-IT',{day:'2-digit',month:'short',year:'numeric'})}
function daysAgo(d){if(!d)return 999;return Math.floor((Date.now()-new Date(d))/86400000)}
function fmtE(n){return n?'€'+Number(n).toLocaleString('it-IT'):''}

// ── LOGIN ────────────────────────────────────────────
function doLogin(){
  if(document.getElementById('login-pw').value===PWD){
    sessionStorage.setItem('crm_auth','1');
    document.getElementById('login-screen').style.display='none';
    document.getElementById('loading').style.display='flex';
    loadData();
  } else {
    document.getElementById('login-err').textContent='Password errata';
    document.getElementById('login-pw').value='';
  }
}
if(sessionStorage.getItem('crm_auth')==='1'){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('loading').style.display='flex';
}

// ── SYNC ─────────────────────────────────────────────
function setSync(state,text){
  document.getElementById('sync-dot').className='sync-dot '+state;
  document.getElementById('sync-label').textContent=text;
}
async function loadData(){
  setSync('loading','Caricamento...');
  try{
    const r=await fetch(API+'/latest',{headers:{'X-Master-Key':MASTER_KEY,'X-Access-Key':ACCESS_KEY}});
    const d=await r.json();
    contatti=d.record.contatti||[];
    macchine=d.record.macchine||[];
    eventi=d.record.eventi||[];
    setSync('ok','Sincronizzato');
    document.getElementById('loading').style.display='none';
    document.getElementById('app').style.display='block';
    renderContatti();
  }catch(e){
    setSync('err','Errore');
    document.getElementById('loading').innerHTML='<div class="loading-logo">◈ CRM MACCHINE</div><div style="color:var(--red);font-size:13px;margin-top:16px;text-align:center">Errore connessione.<br>Controlla internet e ricarica.</div>';
  }
}
async function saveData(){
  if(saving)return;saving=true;setSync('loading','Salvataggio...');
  try{
    await fetch(API,{method:'PUT',headers:{'Content-Type':'application/json','X-Master-Key':MASTER_KEY,'X-Access-Key':ACCESS_KEY},body:JSON.stringify({contatti,macchine,eventi})});
    setSync('ok','Salvato ✓');
  }catch(e){setSync('err','Errore salvataggio')}
  saving=false;
}

// ── TABS ─────────────────────────────────────────────
function switchTab(t){
  currentTab=t;
  const tabs=['contatti','macchine','eventi'];
  tabs.forEach((tab,i)=>{
    document.querySelectorAll('.tab')[i].classList.toggle('active',tab===t);
    document.getElementById('view-'+tab).style.display=tab===t?'':'none';
  });
  if(t==='contatti')renderContatti();
  else if(t==='macchine')renderMacchine();
  else renderEventi();
}

    return daysAgo(lastDate)>=REMIND_DAYS;
  });
  const rb=document.getElementById('remind-box');
  if(scaduti.length){
    rb.innerHTML=`<div class="remind-section"><div class="remind-title">⏰ Da risentire (${scaduti.length})</div>${scaduti.slice(0,5).map(c=>`<div class="remind-item" onclick="openDetailC('${c.id}')"><div><div class="remind-name">${c.nome} ${c.cognome||''}</div><div style="font-size:11px;color:var(--txt3)">${c.azienda||''}</div></div><span class="remind-days">${daysAgo(getLastContact(c.id))}gg</span></div>`).join('')}${scaduti.length>5?`<div style="font-size:11px;color:var(--txt3);text-align:center;margin-top:6px">+${scaduti.length-5} altri</div>`:''}</div>`;

    return m&&(filterC==='tutti'||c.tipo===filterC);
  }).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

  const stats={cliente:0,fornitore:0,broker:0,misto:0};
  contatti.forEach(c=>stats[c.tipo]=(stats[c.tipo]||0)+1);

    <div class="stat-pill"><div class="stat-num">${contatti.length}</div><div class="stat-lbl">Totali</div></div>
    <div class="stat-pill"><div class="stat-num">${stats.cliente||0}</div><div class="stat-lbl">Clienti</div></div>

  el.innerHTML=list.map(c=>{
    const logs=eventi.filter(e=>e.contactId===c.id).sort((a,b)=>b.date.localeCompare(a.date));

      <div class="card-header">
        <div><div class="card-name">${c.nome} ${c.cognome||''}</div>${c.azienda?`<div class="card-company">${c.azienda}</div>`:''}</div>

        </div>
      </div>

function getLastContact(contactId){
  const logs=eventi.filter(e=>e.contactId===contactId);
  if(!logs.length)return contatti.find(c=>c.id===contactId)?.createdAt||today();
  return logs.sort((a,b)=>b.date.localeCompare(a.date))[0].date;
}

// ── MATCH ─────────────────────────────────────────────
function getMatchScore(keywords, text){
  if(!keywords||!text)return 0;
  const kws=keywords.toLowerCase().split(/[,\s]+/).filter(k=>k.length>2);
  const t=text.toLowerCase();
  return kws.filter(k=>t.includes(k)).length;
}

function findMatchingContatti(macchina){
  // Per una macchina offerta: trova contatti che la cercano
  return contatti.map(c=>{
    const score=getMatchScore(c.cerca, macchina.macchina);
    return{...c,score};
  }).filter(c=>c.score>0).sort((a,b)=>b.score-a.score);
}

function findMatchingMacchine(contatto){
  // Per un contatto: trova macchine offerte aperte che matchano con quello che cerca
  return macchine.filter(m=>m.status==='aperta'&&m.tipo==='offerta').map(m=>{
    const score=getMatchScore(contatto.cerca, m.macchina);
    return{...m,score};
  }).filter(m=>m.score>0).sort((a,b)=>b.score-a.score);
}

function matchHtmlContatti(matches, macchinaId){
  if(!matches.length)return'';
  return`<div class="match-box"><div class="match-title">🎯 Chi potrebbe essere interessato (${matches.length})</div>${matches.map(c=>`<div class="match-item" onclick="closeModal('modal-detail-m');openDetailC('${c.id}')"><div><div class="match-name">${c.nome} ${c.cognome||''}</div><div class="match-sub">${c.azienda||''} ${c.paese?'· '+c.paese:''}</div></div><div class="match-kw">${c.cerca.split(',').slice(0,2).map(k=>k.trim()).join(', ')}</div></div>`).join('')}</div>`;
}

function matchHtmlMacchine(matches){
  if(!matches.length)return'';
  return`<div class="match-box"><div class="match-title">🎯 Macchine disponibili che potrebbero interessargli (${matches.length})</div>${matches.map(m=>`<div class="match-item" onclick="closeModal('modal-detail-c');openDetailM('${m.id}')"><div><div class="match-name">${m.macchina}</div><div class="match-sub">${[m.anno,m.ore?m.ore+' ore':'',fmtE(m.prezzo)].filter(Boolean).join(' · ')}</div></div><span class="badge seg-tipo-offerta" style="font-size:10px">Offerta</span></div>`).join('')}</div>`;
}

// ── ELIMINA ───────────────────────────────────────────
async function eliminaContatto(id){if(!confirm('Eliminare?'))return;contatti=contatti.filter(c=>c.id!==id);eventi=eventi.filter(e=>e.contactId!==id);closeModal('modal-detail-c');renderContatti();await saveData()}
async function eliminaM(id){if(!confirm('Eliminare?'))return;macchine=macchine.filter(m=>m.id!==id);closeModal('modal-detail-m');renderMacchine();await saveData()}
async function eliminaLog(logId,contactId){if(!confirm('Eliminare questo log?'))return;eventi=eventi.filter(e=>e.id!==logId);openDetailC(contactId);renderEventi();await saveData()}
async function toggleM(id){macchine=macchine.map(m=>m.id===id?{...m,status:m.status==='aperta'?'chiusa':'aperta'}:m);closeModal('modal-detail-m');renderMacchine();await saveData()}

// ── INIT ──────────────────────────────────────────────
if(sessionStorage.getItem('crm_auth')==='1')loadData();
</script>
